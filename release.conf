# ---------------------------------------------------------------------------
# wiki-mcp - release coordinates
#
# Single source of truth for WHERE a release goes. Read by scripts/*.sh via
# scripts/lib.sh.
#
# Format: KEY=VALUE, one per line. No spaces around '=', no quotes, no shell
# expansion - the file is parsed, never executed. Lines starting with '#' and
# empty lines are ignored. Every key must have a value; the literal `none`
# means "not set".
#
# Environment beats this file, everywhere. That is what lets a fork publish
# somewhere else with IMAGE_NAMESPACE=... scripts/release.sh, without a commit.
#
# The VERSION is deliberately NOT here. It lives in git tags, which is the one
# place a released version cannot disagree with what was actually released.
# scripts/release.sh reads the latest tag and computes the next one.
#
# Credentials are NEVER stored here. They come from the environment:
#   GITHUB_TOKEN                      (gh, and `docker login ghcr.io`)
#   REGISTRY_USER / REGISTRY_PASSWORD (any other registry)
# ---------------------------------------------------------------------------

# GitHub coordinates. Used to build release URLs and by `gh release create`.
GITHUB_OWNER=kinjelom
GITHUB_REPO=wiki-mcp

# Name of the produced executable (cmd/<name>), and of the archives around it.
BINARY_NAME=wiki-mcp

# Container registry host - no scheme, this is a Docker image reference.
# Use `none` for Docker Hub.
REGISTRY=ghcr.io

# Namespace inside the registry (user, organisation or project path).
IMAGE_NAMESPACE=kinjelom

# Image name and the moving tag published next to the version.
# Use `none` for IMAGE_LATEST_TAG to publish the version tag only.
IMAGE_NAME=wiki-mcp
IMAGE_LATEST_TAG=latest

# Platforms cross-compiled into release archives. Space separated, GOOS/GOARCH.
# CGO is off, so every one of these builds on any host without a cross toolchain.
RELEASE_PLATFORMS=linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64

# Platforms baked into the container image by `scripts/image.sh --multi-arch`.
# A subset of the above: a container only ever runs Linux.
IMAGE_PLATFORMS=linux/amd64 linux/arm64

# Base images used by the two-stage Dockerfile.
GO_BASE_IMAGE=docker.io/library/golang:1.26-alpine
RUNTIME_BASE_IMAGE=gcr.io/distroless/static-debian12:nonroot

# Branch a release may be cut from. scripts/release.sh refuses anything else
# unless given --allow-branch.
DEFAULT_BRANCH=main
